trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

stages:
- stage: Validate
  displayName: Validate
  jobs:
  - job: PythonQuality
    displayName: Python quality and tests
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
      displayName: Install dependencies

    - script: |
        ruff check framework models tests api
      displayName: Ruff lint

    - script: |
        ruff format --check framework models tests api
      displayName: Ruff format check

    - script: |
        pytest --cov=framework --cov=models --cov-fail-under=80
      displayName: Unit tests and coverage

- stage: Package
  dependsOn: Validate
  jobs:
  - job: BuildWheel
    displayName: Build Python wheel
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'

    - script: |
        python -m pip install --upgrade pip build
        python -m build --wheel
      displayName: Build wheel

