bundle:
  name: neso-strategy-policy

include:
  - resources/*.yml

sync:
  include:
    - framework/**
    - models/**
    - jobs/**
    - config/**
    - api/**
    - pyproject.toml
    - requirements.txt
    - README.md

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  test:
    mode: development
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
