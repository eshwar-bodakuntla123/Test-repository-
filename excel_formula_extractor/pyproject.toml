[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-formula-extractor"
version = "1.0.0"
description = "Extract Excel formulas, resolve cell references to business column names, and generate CSV configuration."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9"
]

[project.scripts]
excel-formula-extractor = "excel_formula_extractor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
