[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neso-emissions"
version = "0.1.0"
description = "NESO Emissions Counting Python/PySpark framework"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyspark>=3.5,<3.6",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
neso-emissions = "neso_emissions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
