resources:
  jobs:
    emissions_counting:
      name: neso-emissions-counting-${bundle.target}

      tasks:
        - task_key: calculate_emissions
          python_wheel_task:
            package_name: neso_emissions
            entry_point: neso-emissions
            parameters:
              - run
              - --env
              - ${bundle.target}

          # Replace with the client's approved compute policy/cluster.
          new_cluster:
            spark_version: "REPLACE_WITH_APPROVED_DBR"
            node_type_id: "REPLACE_WITH_APPROVED_NODE_TYPE"
            num_workers: 2
